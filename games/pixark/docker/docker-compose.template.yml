# PixARK runs with host networking. This is not a preference — it is the fix
# for the "world loads but terrain doesn't, players float above nothing" bug.
#
# PixARK serves voxel terrain over a separate channel from the UE4 actor
# replication on the game port. Under Docker's bridge network the server logs
#   LogInit: WinSock: I am <container> (172.19.0.3:0)
# and hands clients that address for the terrain session. 172.19.0.3 is
# unroutable from outside the host, so the client connects, spawns, and
# replicates entities over the NAT'd UDP game port — but the terrain data
# session never establishes and no chunks ever arrive. The old logs show the
# cube server loading 300MB+ of chunks happily while not a single
# BrickWorldDataSenssion client line is ever written.
#
# Host networking removes the bridge entirely: the server sees the host's real
# address and every port binds directly. It also satisfies upstream's warning
# that "PixARK does not like port remapping". Our per-instance port offsets
# already keep every instance on distinct ports, so nothing collides.
#
# The SFTP sidecar stays on the default bridge network — it is a plain TCP
# service with no such address-advertisement problem, so it keeps its mapping.
services:
  pixark-server:
    image: pixark-server:latest
    container_name: ${CONTAINER_NAME}
    network_mode: host
    stop_grace_period: 30s
    stdin_open: true
    tty: true
    volumes:
      - pixark_install:/home/steam/PixARK-dedicated
      - pixark_save_data:/home/steam/PixARK-dedicated/ShooterGame/Saved
${NTSYNC_BLOCK}
    restart: ${RESTART_POLICY}
    environment:
      - UPDATE_ON_START=${UPDATE_ON_START}
      - MAP=${MAP}
      - SESSIONNAME=${SESSION_NAME}
      - SERVERPASSWORD=${SERVER_PASSWORD}
      - SERVERADMINPASSWORD=${ADMIN_PASSWORD}
      - MAXPLAYERS=${MAX_PLAYERS}
      - PORT=${GAME_PORT}
      - QUERYPORT=${QUERY_PORT}
      - RCONPORT=${RCON_PORT}
      - CUBEPORT=${CUBE_PORT}
      - RCONENABLED=${RCON_ENABLED}
      - CULTUREFORCOOKING=${CULTURE}
      - CUBEWORLD=${CUBE_WORLD}
      - MAPSEED=${MAP_SEED}
      - CLUSTERID=${CLUSTER_ID}
      - ALTSAVEDIRECTORYNAME=${ALT_SAVE_DIR}
      - ADDITIONAL_ARGS=${ADDITIONAL_ARGS}
      # base64 of newline-separated Key=Value pairs for GameUserSettings.ini
      # [ServerSettings]; the entrypoint decodes and merges them on each start.
      - PIXARK_SERVER_SETTINGS_B64=${SERVER_SETTINGS_B64}
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT}

  pixark-sftp:
    image: atmoz/sftp:latest
    container_name: ${CONTAINER_NAME}-sftp
    restart: ${RESTART_POLICY}
    ports:
      - "${SFT_PORT}:22"
    volumes:
      - pixark_save_data:/home/${SFT_USER}/saved
    command: ${SFT_USER}:${SFT_PASS}:1001

volumes:
  pixark_install:
    external: true
    name: ${INSTALL_VOLUME_NAME}
  pixark_save_data:
    external: true
    name: ${VOLUME_NAME}
